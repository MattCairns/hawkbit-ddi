[package]
name = "hawkbit-ddi"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Blocking client for the Eclipse hawkBit Direct Device Integration (DDI) API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/hawkbit-ddi"
readme = "README.md"
keywords = ["hawkbit", "ota", "ddi", "iot", "update"]
categories = ["api-bindings", "embedded", "network-programming"]
authors = ["Matthew Cairns <matthew@openoceanrobotics.com>"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.40"
ureq = { version = "3.0.5", features = ["json"] }

[dev-dependencies]
mockito = "1.7"
